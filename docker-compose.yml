name: yayasan-mardhotillah

services:
  db:
    image: postgres:16-alpine
    container_name: ym_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mardhotillah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-mardhotillah}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mardhotillah} -d ${POSTGRES_DB:-mardhotillah}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    container_name: ym_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mardhotillah:change_me_strong_password@db:5432/mardhotillah?schema=public}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_min_32_characters_long!}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3102}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3102:3000"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3102}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
    container_name: ym_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3102}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3100:3000"

  admin:
    build:
      context: ./apps/admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3102}
        ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-}
    container_name: ym_admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3102}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3101:3000"

volumes:
  pgdata:
  uploads:
